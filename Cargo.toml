[package]
name = "health_http"
version = "0.1.0"
edition = "2024"

[dependencies]
rustix = { version = "1.1", default-features = false, features = ["net", "runtime", "stdio"] }

[profile.dev]
panic = "abort"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
debug = 0
incremental = false
